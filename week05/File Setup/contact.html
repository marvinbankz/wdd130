<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Rafting Travel for trip questions, reservations, or general inquiries.">

    <meta name="author" content="Kalule Marvin">

    <link rel="stylesheet" href="styles/rafting.css">

    <title>Rafting Travel | Contact Us</title>
</head>

<body>

    <header>
        <img src="images/images/log-for-water-rafting.jpg.jpeg" alt="Rafting Travel company logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!--Company Information-->
        <section class="company-information">

            <h1>RAFTING TRAVEL</h1>

            <p>Kanyanya Road</p>
            <p>Ndejje, Uganda</p>
            <p>
                <a href="tel:+256 789689629">+256 789689629</a>
            </p>
            <p>
                <a href="mailto:marvinbankz2025@gmail.com">
                    marvinbankz2025@gmail.com
                </a>
            </p>

        </section>

        <!--Map and Contact Form-->
        <section class="contact-area">

            <!--Google Map-->
            <section class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d388993.8803159768!2d32.56324628666357!3d0.4756727585798618!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177e7fc5cd2ffc09%3A0xef15d2f8caf73!2sRush%20River%20Rafting!5e1!3m2!1sen!2sug!4v1795544015186!5m2!1sen!2sug" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
                    title="Map showing the location">
                </iframe>

                <!-- Contact Form -->
                <form class="contact-form">

                    <div class="form-item">

                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Kalule Marvin">

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="marvinbankz2025@gmail.com">

                        <p class="form-label">Message Purpose</p>

                        <div class="radio-option">
                            <input type="radio" id="general" name="messagepurpose" value="general inquiry" required>

                            <label for="general">
                                General Inquiry
                            </label>
                        </div>


                        <div class="radio-option">
                            <input type="radio" id="reservation" name="messagepurpose" value="reservation question">

                            <label for="reservation">
                                Reservation Question
                            </label>
                        </div>


                        <div class="radio-option">
                            <input type="radio" id="suggestion" name="messagepurpose" value="website suggestion">

                            <label for="suggestion">
                                Website Suggestion
                            </label>
                        </div>


                        <label for="message">Message:</label>

                        <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>


                        <div class="checkbox-option">

                            <input type="checkbox" id="subscribe" name="subscribe">

                            <label for="subscribe">
                                Please subscribe me to the monthly newsletter
                            </label>

                        </div>


                        <button type="submit">
                            Get in Touch
                        </button>

                    </div>

                </form>

            </section>


            <!-- Employee Profiles -->
            <section class="employee-section">

                <h2>We Are Here to Serve You</h2>

                <div class="employee-gallery">

                    <figure>
                        <img src="images/boat-rapids.jpg.jpeg" alt="Rafting through leading an outdoor river adventure">

                        <figcaption>
                            Trip Guide
                        </figcaption>
                    </figure>


                    <figure>
                        <img src="images/family.jpg.jpeg" alt="Customer service representative assisting a rafting customer">

                        <figcaption>
                            Customer Service Representative
                        </figcaption>
                    </figure>


                    <figure>
                        <img src="images/friends-enjoying.jpg.jpeg" alt="Rafting safety coordinator supporting a river adventure">

                        <figcaption>
                            Safety Coordinator
                        </figcaption>
                    </figure>

                </div>

            </section>


    </main>

    <!-- Footer -->
    <footer>
        <p>
            &copy; 2026 💦 Rafting Travel, Kalule Marvin
        </p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/images/facebook-logo.png" alt="Facebook social media logo">
            </a>
            <a href="https://in.com" target="_blank" rel="noopener noreferrer">
                <img src="images/images/in-logo.png" alt="In social media logo">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/images/instagram.jfif.jpeg" alt="Instagram social media logo">
            </a>
        </nav>
    </footer>

</body>

</html>
